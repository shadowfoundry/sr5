<?xml version="1.0" encoding="utf-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 113.4 113.4" width="512" height="512">
<style>.st0{fill:#FFFFFF;}</style>
<g>
  <!-- Bullet casing -->
  <rect class="st0" x="22" y="18" width="22" height="60" rx="3"/>
  <rect class="st0" x="25" y="12" width="16" height="10" rx="2"/>
  <!-- Bullet tip -->
  <path class="st0" d="M25,18 L33,4 L41,18 Z"/>
  <!-- Second bullet (smaller, behind) -->
  <rect class="st0" x="50" y="24" width="18" height="50" rx="3" opacity="0.6"/>
  <rect class="st0" x="52.5" y="19" width="13" height="8" rx="2" opacity="0.6"/>
  <path class="st0" d="M52.5,24 L59,12 L65.5,24 Z" opacity="0.6"/>
  <!-- Gear/cog symbol (indicating "type definition") -->
  <g transform="translate(78,78)">
    <circle class="st0" cx="0" cy="0" r="8" fill="none" stroke="#FFFFFF" stroke-width="3"/>
    <circle class="st0" cx="0" cy="0" r="3"/>
    <!-- Gear teeth -->
    <rect class="st0" x="-2" y="-14" width="4" height="6"/>
    <rect class="st0" x="-2" y="8" width="4" height="6"/>
    <rect class="st0" x="-14" y="-2" width="6" height="4"/>
    <rect class="st0" x="8" y="-2" width="6" height="4"/>
    <rect class="st0" x="6" y="-11" width="4" height="6" transform="rotate(45,8,-8)"/>
    <rect class="st0" x="-10" y="5" width="4" height="6" transform="rotate(45,-8,8)"/>
    <rect class="st0" x="6" y="5" width="4" height="6" transform="rotate(-45,8,8)"/>
    <rect class="st0" x="-10" y="-11" width="4" height="6" transform="rotate(-45,-8,-8)"/>
  </g>
</g>
</svg>
