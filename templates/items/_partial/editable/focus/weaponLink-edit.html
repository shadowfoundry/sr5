{{#if (eq system.type 'weapon')}}
<li class="grid">
    <div class="col-4">{{localize 'SR5.LinkedWeapon'}}{{localize 'SR5.Colons'}}</div>
    <div class="col-8">
        <select name="system.linkedWeapon" data-dtype="String" required>
            <option class="SR-LightGreyColor" value="">{{localize 'SR5.ChooseOne'}}</option>
            {{selectOptions weaponChoices selected=system.linkedWeapon valueAttr="id" labelAttr="name" localize=false sort=true}}
        </select>
    </div>
</li>
{{/if}}
