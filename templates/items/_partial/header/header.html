<div class="SR-Header">
	<img class="SRImgItem" src="{{item.img}}" data-title="{{localize 'SR5.UI_ChangePicture'}}" data-edit="img" />
	<h1 class="SRItemTitre"><input name="name" type="text" value="{{item.name}}" placeholder="Nom" /></h1>
	<nav class="tabs content" data-group="primary">
		<a class="item" data-tab="tab-info" data-group="primary" data-action="tab" data-title="{{localize 'SR5.ItemInformation'}}">{{> systems/sr5/img/icons/nav-information.svg}}</a>
		<a class="item" data-tab="tab-stat" data-group="primary" data-action="tab" data-title="{{localize 'SR5.ItemConfiguration'}}">{{> systems/sr5/img/icons/nav-configuration.svg}}</a>
		<a class="item" data-tab="tab-effect" data-group="primary" data-action="tab" data-title="{{localize 'SR5.ItemModifiers'}}">{{> systems/sr5/img/icons/nav-modifiers.svg}}</a>
	</nav>
</div>
